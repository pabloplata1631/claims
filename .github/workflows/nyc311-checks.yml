name: NYC311 foundation checks
on:
  push:
    paths: ['nyc311/**', '.github/workflows/nyc311-checks.yml']
  pull_request:
    paths: ['nyc311/**', '.github/workflows/nyc311-checks.yml']
permissions:
  contents: read
jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s nyc311/tests -v
